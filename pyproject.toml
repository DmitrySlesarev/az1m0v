[tool.poetry]
name = "az1m0v"
version = "1.0.0"
description = "Electric Vehicle Management System"
authors = ["Dmitry Slesarev <dvslesar@gmail.com>"]
license = "GPL"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
jsonschema = "^4.0"
numpy = "^2.0.0"
pyserial = "^3.5"
flask = "^3.0.0"
flask-socketio = "^5.3.0"
# Optional: pulls PyTorch; requires Python >=3.12 per upstream. Use: poetry install -E alpamayo
alpamayo-tools = { version = "^0.2.0", optional = true, python = ">=3.12,<3.14" }

[tool.poetry.extras]
alpamayo = ["alpamayo-tools"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.0"

# Optional: no armv7l wheels for Playwright; install with: poetry install --with playwright
[tool.poetry.group.playwright]
optional = true

[tool.poetry.group.playwright.dependencies]
pytest-playwright = "^0.7.2"
playwright = "^1.57.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "playwright: marks tests as playwright tests (deselect with '-m \"not playwright\"')",
    "integration: marks tests as integration tests that may be slower or flaky",
]
